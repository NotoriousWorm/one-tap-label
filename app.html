<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One-Tap Label - Create Label</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 38px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 35px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 15px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
        }

        .label-card {
            margin-top: 20px;
            padding: 25px;
            border: 2px solid #111827;
            border-radius: 15px;
            background: #f8fafc;
        }

        .delete-button {
            background: #dc2626;
            margin-top: 15px;
        }

        .delete-button:hover {
            background: #b91c1c;
        }

        .qr-code {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="card">

            <h1>Create a Label</h1>

            <p class="subtitle">
                Give your stuff a digital identity.
            </p>


            <label for="item">
                What's in this container?
            </label>

            <input
                type="text"
                id="item"
                placeholder="Example: Christmas decorations"
            >


            <label for="location">
                Where is it?
            </label>

            <input
                type="text"
                id="location"
                placeholder="Example: Garage - Shelf 3"
            >


            <button onclick="createLabel()">
                Create Label
            </button>


            <div id="labelResult"></div>


            <a href="index.html" class="back">
                ← Back to One-Tap Label
            </a>

        </div>

    </div>


    <!-- QR CODE LIBRARY -->

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>


    <script>

        function createLabel() {

            const item =
                document.getElementById("item").value;

            const location =
                document.getElementById("location").value;

            const result =
                document.getElementById("labelResult");


            if (item === "" || location === "") {

                result.innerHTML =
                    "<p>Please enter both the item and its location.</p>";

                return;
            }


            let labels =
                JSON.parse(
                    localStorage.getItem("oneTapLabels")
                ) || [];


            const newLabel = {

                id:
                    "OTL-" +
                    Math.random()
                        .toString(36)
                        .substring(2, 6)
                        .toUpperCase(),

                item: item,

                location: location

            };


            labels.push(newLabel);


            localStorage.setItem(
                "oneTapLabels",
                JSON.stringify(labels)
            );


            displayLabels();


            document.getElementById("item").value = "";

            document.getElementById("location").value = "";

        }



        function deleteLabel(index) {

            let labels =
                JSON.parse(
                    localStorage.getItem("oneTapLabels")
                ) || [];


            labels.splice(index, 1);


            localStorage.setItem(
                "oneTapLabels",
                JSON.stringify(labels)
            );


            displayLabels();

        }



        function displayLabels() {

            const result =
                document.getElementById("labelResult");


            let labels =
                JSON.parse(
                    localStorage.getItem("oneTapLabels")
                ) || [];


            /*
             * Give older labels an ID
             */

            labels.forEach(function(label) {

                if (!label.id) {

                    label.id =
                        "OTL-" +
                        Math.random()
                            .toString(36)
                            .substring(2, 6)
                            .toUpperCase();

                }

            });


            localStorage.setItem(
                "oneTapLabels",
                JSON.stringify(labels)
            );


            if (labels.length === 0) {

                result.innerHTML = "";

                return;

            }


            let html = "";


            labels.forEach(function(label, index) {


                html += `

                    <div class="label-card">

                        <h2>
                            Label ${index + 1}
                        </h2>


                        <p>

                            <strong>ID:</strong>

                            ${label.id}

                        </p>


                        <p>

                            <strong>Item:</strong>

                            ${label.item}

                        </p>


                        <p>

                            <strong>Location:</strong>

                            ${label.location}

                        </p>


                        <div
                            id="qr-${label.id}"
                            class="qr-code"
                        >
                        </div>


                        <button
                            class="delete-button"
                            onclick="deleteLabel(${index})"
                        >

                            Delete

                        </button>

                    </div>

                `;

            });


            result.innerHTML = html;


            /*
             * Create QR codes after the labels
             * have been added to the page.
             */

            labels.forEach(function(label) {

                new QRCode(

                    document.getElementById(
                        "qr-" + label.id
                    ),

                    {
                        text: label.id,
                        width: 150,
                        height: 150
                    }

                );

            });

        }



        window.onload = function() {

            displayLabels();

        };

    </script>


</body>

</html>
